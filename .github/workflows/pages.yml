name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "cockpit/web/**"
      - "connected-robots/bimanual-bunker-mini/**"
      - "scripts/build_pages.py"
      - ".gitattributes"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build website with verified public assets
        run: python3 scripts/build_pages.py --output "${{ runner.temp }}/argus-pages"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/argus-pages

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
